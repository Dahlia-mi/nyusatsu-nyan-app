name: Supplier Nyan UI Review Artifact

on:
  push:
    branches:
      - feature/supplier-nyan-v0.3.0-case-list
    paths:
      - supplier-nyan/prototypes/**
      - supplier-nyan/assets/home-v1/**
      - .github/workflows/supplier-nyan-ui-review-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplier-nyan-ui-review-artifact
  cancel-in-progress: true

jobs:
  package-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Upload supplier-nyan review artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplier-nyan-ui-review-${{ github.sha }}
          path: supplier-nyan
          if-no-files-found: error
          retention-days: 14
