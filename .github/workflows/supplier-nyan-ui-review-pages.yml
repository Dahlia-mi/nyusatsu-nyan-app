name: Supplier Nyan UI Review Pages

on:
  push:
    branches:
      - feature/supplier-nyan-v0.3.0-case-list
    paths:
      - supplier-nyan/prototypes/**
      - supplier-nyan/assets/home-v1/**
      - .github/workflows/supplier-nyan-ui-review-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: supplier-nyan-ui-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload supplier-nyan static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: supplier-nyan

      - name: Deploy review site
        id: deployment
        uses: actions/deploy-pages@v4
