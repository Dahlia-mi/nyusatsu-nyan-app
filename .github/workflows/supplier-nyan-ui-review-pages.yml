name: Supplier Nyan UI Review Pages

on:
  push:
    branches:
      - feature/supplier-nyan-v0.3.0-case-list
    paths:
      - supplier-nyan/prototypes/**
      - supplier-nyan/assets/home-v1/**
      - .github/workflows/supplier-nyan-ui-review-pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: supplier-nyan-ui-review-pages
  cancel-in-progress: true

jobs:
  package-review:
    if: github.ref == 'refs/heads/feature/supplier-nyan-v0.3.0-case-list'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Upload supplier-nyan Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: supplier-nyan

  deploy:
    if: github.ref == 'refs/heads/feature/supplier-nyan-v0.3.0-case-list'
    needs: package-review
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy review site
        id: deployment
        uses: actions/deploy-pages@v4
