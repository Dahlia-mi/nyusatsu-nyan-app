    <header class="app-header" aria-label="仕入先にゃん ヘッダー">
      <button id="settingsButton" class="header-icon-button brand-mark"
        type="button" aria-label="アプリ設定を開く">
        <img data-home-asset-key="brand.mark.paw" alt="">
      </button>

      <div class="header-actions" aria-label="お知らせ">
        <span id="environmentBadge" class="environment-badge" hidden>TEST</span>
        <button class="header-icon-button" type="button" aria-label="通知">
          <img data-home-asset-key="header.notification" alt="">
          <span class="unread-badge" id="notificationBadge" hidden></span>
        </button>
        <button class="header-icon-button" type="button" aria-label="メール">
          <img data-home-asset-key="header.mail" alt="">
          <span class="unread-badge" id="mailBadge" hidden></span>
        </button>
      </div>
    </header>

    <nav class="bottom-navigation" aria-label="主要メニュー"
      id="bottomNavigation">
      <img class="nav-grass nav-grass--left"
        data-home-asset-key="decoration.grass.left" alt="">
      <div class="nav-items" id="navItems"></div>
      <img class="nav-grass nav-grass--right"
        data-home-asset-key="decoration.grass.right" alt="">
    </nav>
