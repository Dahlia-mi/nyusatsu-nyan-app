<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>仕入先にゃん</title>
  <style>
    :root {
      --cream: #fff8ed;
      --paper: #fffdf8;
      --orange: #ef8b4b;
      --orange-dark: #b9552b;
      --peach: #ffe1c7;
      --brown: #4a352d;
      --muted: #76645c;
      --line: #efd8c7;
      --success: #4e8663;
      --danger: #a94b48;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic UI", sans-serif;
      color: var(--brown);
      background: var(--cream);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--cream);
    }
    body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .shell { width: min(100%, 680px); margin: 0 auto; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: rgba(255, 248, 237, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand { margin: 0; font-size: 1.12rem; }
    .cat-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--peach);
      font-size: 1.45rem;
    }
    .companion { margin: 2px 0 0; color: var(--muted); font-size: .84rem; }
    .icon-button {
      min-width: 44px;
      min-height: 44px;
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }
    main { padding: 16px; }
    .screen[hidden] { display: none !important; }
    .section-heading { margin: 4px 0 6px; font-size: 1.28rem; }
    .section-lead { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
    .stack { display: grid; gap: 12px; }
    .card {
      width: 100%;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 5px 16px rgba(93, 56, 37, .06);
    }
    .case-card {
      display: block;
      padding: 16px;
      border: 1px solid var(--line);
      text-align: left;
      color: inherit;
    }
    .case-card:active { transform: scale(.99); }
    .eyebrow {
      color: var(--orange-dark);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .case-title { margin: 6px 0 10px; font-size: 1.06rem; line-height: 1.45; }
    .meta-grid { display: grid; gap: 5px; color: var(--muted); font-size: .88rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .badge {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f7eee6;
      font-size: .78rem;
      font-weight: 700;
    }
    .badge.warn { color: #934c23; background: #fff0c7; }
    .item-preview { margin: 12px 0 0; padding-left: 20px; font-size: .88rem; }
    .item-preview li + li { margin-top: 4px; }
    .detail-header { padding: 16px; margin-bottom: 14px; }
    .back-button, .secondary-button, .primary-button, .copy-button {
      min-height: 46px;
      border-radius: 14px;
      font-weight: 700;
    }
    .back-button {
      margin-bottom: 12px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .item-card { padding: 16px; }
    .item-card-head { display: flex; gap: 10px; align-items: flex-start; }
    .item-card-head h3 { flex: 1; margin: 3px 0 0; font-size: 1.04rem; }
    .copy-button {
      flex: none;
      padding: 0 12px;
      border: 1px solid #efc4a6;
      background: #fff3e8;
      color: var(--orange-dark);
    }
    .fields { display: grid; gap: 9px; margin: 14px 0 0; }
    .field {
      display: grid;
      grid-template-columns: 5.5em minmax(0, 1fr);
      gap: 8px;
      font-size: .9rem;
    }
    .field dt { color: var(--muted); }
    .field dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .action-row { display: grid; gap: 10px; margin-top: 14px; }
    .secondary-button {
      padding: 0 14px;
      border: 1px solid #efc4a6;
      background: var(--paper);
      color: var(--orange-dark);
    }
    .primary-button {
      padding: 0 16px;
      border: 0;
      background: var(--orange);
      color: #fff;
    }
    .empty, .error, .loading {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
    }
    .error { color: var(--danger); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      align-items: end;
      padding: 16px;
      background: rgba(53, 36, 28, .42);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 20px;
      border-radius: 22px;
      background: var(--paper);
    }
    .modal-card h2 { margin: 0 0 8px; }
    .modal-card p { color: var(--muted); }
    .name-input {
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 1rem;
    }
    .modal-actions { display: grid; gap: 10px; margin-top: 14px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 30;
      max-width: calc(100% - 32px);
      transform: translateX(-50%);
      padding: 11px 16px;
      border-radius: 999px;
      background: #3e302a;
      color: #fff;
      font-size: .86rem;
    }
    @media (min-width: 540px) {
      .action-row { grid-template-columns: 1fr 1fr; }
      .modal { align-items: center; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-row">
        <span class="cat-mark" aria-hidden="true">🐈</span>
        <div>
          <h1 class="brand">仕入先にゃん</h1>
          <p id="companionText" class="companion">仕入先を探そう</p>
        </div>
        <button id="settingsButton" class="icon-button" type="button"
          aria-label="猫の名前を変更">⚙️</button>
      </div>
    </header>

    <main>
      <section id="listScreen" class="screen">
        <h2 class="section-heading">調査する案件</h2>
        <p class="section-lead">案件を選んで、品目を確認しましょう。</p>
        <div id="caseList" class="stack">
          <div class="loading">案件を読み込んでいます…</div>
        </div>
      </section>

      <section id="detailScreen" class="screen" hidden>
        <button id="backButton" class="back-button" type="button">← 案件一覧</button>
        <div id="caseDetail"></div>
      </section>
    </main>
  </div>

  <div id="nameModal" class="modal" hidden role="dialog" aria-modal="true"
    aria-labelledby="nameModalTitle">
    <form id="nameForm" class="modal-card">
      <h2 id="nameModalTitle">相棒に名前をつけよう</h2>
      <p>一緒に仕入先を探す相棒の猫です。あとで変更できます。</p>
      <label for="catName">猫の名前</label>
      <input id="catName" class="name-input" maxlength="20"
        autocomplete="off" required>
      <div class="modal-actions">
        <button class="primary-button" type="submit">この名前にする</button>
        <button id="cancelNameButton" class="secondary-button" type="button">
          キャンセル
        </button>
      </div>
    </form>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script>
    (function () {
      'use strict';

      var state = {
        environment: 'unknown',
        catName: '',
        cases: [],
        currentCase: null
      };

      var CatNameStorage = {
        key: function () {
          return 'supplier-nyan:' + state.environment + ':cat-name:v1';
        },
        get: function () {
          try { return (localStorage.getItem(this.key()) || '').trim(); }
          catch (error) { return ''; }
        },
        set: function (name) {
          localStorage.setItem(this.key(), name);
        }
      };

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function api(functionName) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(function (response) {
              if (response && response.success) resolve(response.data);
              else reject(new Error(
                response && response.error
                  ? response.error.message
                  : 'データを取得できませんでした。'
              ));
            })
            .withFailureHandler(function () {
              reject(new Error('通信に失敗しました。もう一度お試しください。'));
            });
          runner[functionName].apply(runner, args);
        });
      }

      function equivalentLabel(value) {
        if (value === true) return '同等品可';
        if (value === false) return '同等品不可';
        return '未確認';
      }

      function itemCopyText(item) {
        return [
          '品目名：' + (item.name || ''),
          '数量：' + (item.quantity === '' ? '' : item.quantity),
          '単位：' + (item.unit || ''),
          '仕様：' + (item.specification || ''),
          'メーカー：' + (item.manufacturer || ''),
          'ブランド：' + (item.brand || ''),
          '型番：' + (item.modelNumber || ''),
          '同等品可：' + equivalentLabel(item.equivalentAllowed)
        ].join('\n');
      }

      function copyText(text) {
        var copyPromise;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          copyPromise = navigator.clipboard.writeText(text);
        } else {
          var area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
          copyPromise = Promise.resolve();
        }
        return copyPromise.then(function () { showToast('コピーしました'); });
      }

      function showToast(message) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.hidden = false;
        window.setTimeout(function () { toast.hidden = true; }, 1800);
      }

      function updateCompanion() {
        document.getElementById('companionText').textContent = state.catName
          ? state.catName + 'と仕入先を探そう'
          : '仕入先を探そう';
      }

      function openNameModal(isInitial) {
        document.getElementById('catName').value = state.catName;
        document.getElementById('cancelNameButton').hidden =
          Boolean(isInitial && !state.catName);
        document.getElementById('nameModal').hidden = false;
        window.setTimeout(function () {
          document.getElementById('catName').focus();
        }, 0);
      }

      function closeNameModal() {
        document.getElementById('nameModal').hidden = true;
      }

      function renderCaseList() {
        var container = document.getElementById('caseList');
        if (!state.cases.length) {
          container.innerHTML =
            '<div class="card empty">現在、調査対象の案件はありません。</div>';
          return;
        }
        container.innerHTML = state.cases.map(function (item) {
          var previews = item.primaryItems.map(function (product) {
            var amount = [product.quantity, product.unit].filter(Boolean).join('');
            return '<li>' + escapeHtml(product.name || '名称未設定') +
              (amount ? ' <small>' + escapeHtml(amount) + '</small>' : '') +
              '</li>';
          }).join('');
          if (item.remainingItemCount) {
            previews += '<li>ほか' + item.remainingItemCount + '件</li>';
          }
          return '<button class="card case-card" type="button" data-case-id="' +
            escapeHtml(item.caseId) + '">' +
            '<span class="eyebrow">' + escapeHtml(item.caseId) + '</span>' +
            '<h3 class="case-title">' +
            escapeHtml(item.caseName || '案件名未設定') + '</h3>' +
            '<div class="meta-grid">' +
            (item.agency ? '<span>🏢 ' + escapeHtml(item.agency) + '</span>' : '') +
            (item.deadline ? '<span>⏰ 提出締切 ' +
              escapeHtml(item.deadline) + '</span>' : '') +
            '<span>📌 ' + escapeHtml(item.status) + '</span></div>' +
            '<div class="badges"><span class="badge">品目 ' +
            item.itemCount + '件</span>' +
            (item.unknownEquivalentCount
              ? '<span class="badge warn">同等品可 未確認 ' +
                item.unknownEquivalentCount + '件</span>'
              : '') + '</div>' +
            (previews ? '<ul class="item-preview">' + previews + '</ul>' : '') +
            '</button>';
        }).join('');
      }

      function field(label, value) {
        if (value === '' || value === null || value === undefined) return '';
        return '<div class="field"><dt>' + escapeHtml(label) + '</dt><dd>' +
          escapeHtml(value) + '</dd></div>';
      }

      function renderDetail(data) {
        state.currentCase = data.case;
        var itemCards = data.case.items.map(function (item, index) {
          return '<article class="card item-card">' +
            '<div class="item-card-head"><div><span class="eyebrow">' +
            escapeHtml(item.itemId) + '</span><h3>' +
            escapeHtml(item.name || '品目名未設定') + '</h3></div>' +
            '<button class="copy-button" type="button" data-copy-item="' +
            index + '">まとめてコピー</button></div>' +
            '<dl class="fields">' +
            field('数量', item.quantity) + field('単位', item.unit) +
            field('仕様', item.specification) +
            field('メーカー', item.manufacturer) +
            field('ブランド', item.brand) +
            field('型番', item.modelNumber) +
            field('同等品可', equivalentLabel(item.equivalentAllowed)) +
            '</dl><div class="action-row">' +
            '<button class="secondary-button" type="button" data-copy-name="' +
            index + '">品目名をコピー</button></div></article>';
        }).join('');
        document.getElementById('caseDetail').innerHTML =
          '<section class="card detail-header"><span class="eyebrow">' +
          escapeHtml(data.case.caseId) + '</span><h2 class="section-heading">' +
          escapeHtml(data.case.caseName || '案件名未設定') + '</h2>' +
          '<div class="meta-grid">' +
          (data.case.agency ? '<span>🏢 ' +
            escapeHtml(data.case.agency) + '</span>' : '') +
          (data.case.deadline ? '<span>⏰ 提出締切 ' +
            escapeHtml(data.case.deadline) + '</span>' : '') +
          '<span>📌 ' + escapeHtml(data.case.status) + '</span></div>' +
          (data.case.items.length
            ? '<div class="action-row"><button id="copyAllButton" ' +
              'class="primary-button" type="button">全品目をコピー</button></div>'
            : '') + '</section><div class="stack">' +
          (itemCards ||
            '<div class="card empty">この案件には有効な品目がありません。</div>') +
          '</div>';
        document.getElementById('listScreen').hidden = true;
        document.getElementById('detailScreen').hidden = false;
        window.scrollTo(0, 0);
      }

      function showError(containerId, error) {
        document.getElementById(containerId).innerHTML =
          '<div class="card error">' + escapeHtml(error.message) + '</div>';
      }

      function loadCases() {
        return api('api_listResearchCases').then(function (data) {
          state.cases = data.cases || [];
          renderCaseList();
        }).catch(function (error) {
          showError('caseList', error);
        });
      }

      function openCase(caseId) {
        document.getElementById('caseDetail').innerHTML =
          '<div class="loading">品目を読み込んでいます…</div>';
        document.getElementById('listScreen').hidden = true;
        document.getElementById('detailScreen').hidden = false;
        api('api_getResearchCaseDetail', caseId)
          .then(renderDetail)
          .catch(function (error) { showError('caseDetail', error); });
      }

      document.getElementById('caseList').addEventListener('click', function (e) {
        var card = e.target.closest('[data-case-id]');
        if (card) openCase(card.getAttribute('data-case-id'));
      });
      document.getElementById('backButton').addEventListener('click', function () {
        document.getElementById('detailScreen').hidden = true;
        document.getElementById('listScreen').hidden = false;
        state.currentCase = null;
      });
      document.getElementById('caseDetail').addEventListener('click', function (e) {
        var itemIndex = e.target.getAttribute('data-copy-item');
        var nameIndex = e.target.getAttribute('data-copy-name');
        if (itemIndex !== null && state.currentCase) {
          copyText(itemCopyText(state.currentCase.items[Number(itemIndex)]));
        }
        if (nameIndex !== null && state.currentCase) {
          copyText(state.currentCase.items[Number(nameIndex)].name || '');
        }
        if (e.target.id === 'copyAllButton' && state.currentCase) {
          copyText(state.currentCase.items.map(function (item, index) {
            return '【品目' + (index + 1) + '】\n' + itemCopyText(item);
          }).join('\n\n'));
        }
      });
      document.getElementById('settingsButton').addEventListener('click',
        function () { openNameModal(false); });
      document.getElementById('cancelNameButton').addEventListener('click',
        closeNameModal);
      document.getElementById('nameForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('catName').value.trim();
        if (!name) return;
        try {
          CatNameStorage.set(name);
          state.catName = name;
          updateCompanion();
          closeNameModal();
          showToast('相棒の名前を保存しました');
        } catch (error) {
          showToast('名前を保存できませんでした');
        }
      });

      api('api_getAppContext').then(function (context) {
        state.environment = context.environment;
        state.catName = CatNameStorage.get();
        updateCompanion();
        if (!state.catName) openNameModal(true);
        return loadCases();
      }).catch(function (error) {
        showError('caseList', error);
      });

      window.SupplierNyanUi = Object.freeze({
        equivalentLabel: equivalentLabel,
        itemCopyText: itemCopyText
      });
    })();
  </script>
</body>
</html>
