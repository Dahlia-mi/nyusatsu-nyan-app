      'use strict';
      var state = {
        cases: [],
        currentCase: null,
        selectedItemId: '',
        catName: '',
        environment: '',
        version: '',
        deploymentVersion: '',
        toastTimer: null,
        savingName: false,
        progressSaving: {},
        quoteUploading: {}
        ,activeQuest: ''
        ,questCounts: {}
        ,homeScrollY: 0
        ,restoredNavigation: null
      };

      var NAVIGATION_KEY = 'supplier-nyan:navigation:v1';
      var QUESTS = Object.freeze([
        { type: 'quote_followup', label: '見積回答を確認' },
        { type: 'supplier_search', label: '新しい仕入先を調査' },
        { type: 'document_review', label: '見積PDFを確認' }
      ]);

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function api(name) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(function (result) {
              if (result && result.success) resolve(result.data);
              else reject(new Error(
                result && result.error ? result.error.message : '処理に失敗しました。'
              ));
            })
            .withFailureHandler(function () {
              reject(new Error('通信に失敗しました。再度お試しください。'));
            });
          runner[name].apply(runner, args);
        });
      }

      function equivalentLabel(value) {
        if (value === true) return '同等品可';
        if (value === false) return '同等品不可';
        return '未確認';
      }

      function equivalentChip(value) {
        var className = value === true ? 'allow' : value === false ? 'deny' : 'unknown';
        return '<span class="chip ' + className + '">' +
          escapeHtml(equivalentLabel(value)) + '</span>';
      }

      function quantityText(item) {
        var value = item.quantity === '' ? '数量未設定' : item.quantity;
        return String(value) + (item.unit || '');
      }

      function shortDeadline(value) {
        var match = String(value || '').match(/(?:\d{4}\/)?(\d{1,2})\/(\d{1,2})/);
        return match ? Number(match[1]) + '/' + Number(match[2]) : String(value || '');
      }

      function itemCopyText(item) {
        var lines = [
          ['品目名', item.name],
          ['数量', item.quantity],
          ['単位', item.unit],
          ['仕様', item.specification],
          ['メーカー', item.manufacturer],
          ['ブランド', item.brand],
          ['型番', item.modelNumber],
          ['同等品可', equivalentLabel(item.equivalentAllowed)]
        ];
        return lines.filter(function (entry) {
          return entry[1] !== '' && entry[1] !== null && entry[1] !== undefined;
        }).map(function (entry) {
          return entry[0] + '：' + entry[1];
        }).join('\n');
      }

      function showToast(message, options) {
        var toast = document.getElementById('toast');
        var settings = options || {};
        clearTimeout(state.toastTimer);
        toast.className = 'toast' + (settings.type ? ' ' + settings.type : '');
        toast.textContent = message;
        toast.hidden = false;
        state.toastTimer = setTimeout(function () {
          toast.hidden = true;
          toast.className = 'toast';
        }, settings.duration || 1600);
      }

      function quoteSuccessMessage(supplierName) {
        var company = String(supplierName || '').trim();
        return company
          ? '🎉 クエスト完了！\n' + company + 'の見積書を受け取ったにゃ！'
          : '📦 見積書を保管したにゃ！';
      }

      function copyText(text) {
        if (!text) return showToast('コピーする内容がありません');
        var task = navigator.clipboard && navigator.clipboard.writeText
          ? navigator.clipboard.writeText(text)
          : Promise.reject(new Error('clipboard unavailable'));
        task.then(function () {
          showToast('コピーしました');
        }).catch(function () {
          showToast('コピーできませんでした');
        });
      }

      function updateCompanion() {
        document.getElementById('companionText').textContent = state.catName
          ? state.catName + 'と仕入先を探そう'
          : '仕入先を探そう';
      }

      function openNameModal(required) {
        document.getElementById('nameModal').hidden = false;
        document.getElementById('cancelNameButton').hidden = Boolean(required);
        document.getElementById('catName').value = state.catName || '';
        setTimeout(function () { document.getElementById('catName').focus(); }, 0);
      }

      function closeNameModal() {
        if (!state.catName) return;
        document.getElementById('nameModal').hidden = true;
      }

      function statusLabel(item) {
        return item.researchStatus || (item.contacted ? '調査中' : '未着手');
      }

      function statusClass(value) {
        return value === '完了' ? 'complete' :
          value === '回答待ち' ? 'waiting' :
          value === '調査中' ? 'researching' : 'unstarted';
      }

      var CAT_STATE_RULES = Object.freeze([
        {
          state: 'complete',
          matches: function (counts, total) {
            return total > 0 && counts['完了'] === total;
          }
        },
        {
          state: 'researching',
          matches: function (counts) {
            return counts['調査中'] > 0 || counts['回答待ち'] > 0;
          }
        },
        {
          state: 'recommended',
          matches: function (counts) { return counts['未着手'] > 0; }
        },
        {
          state: 'grooming',
          matches: function () { return true; }
        }
      ]);

      function catStateForItems(items) {
        var counts = { '未着手': 0, '調査中': 0, '回答待ち': 0, '完了': 0 };
        items.forEach(function (entry) { counts[statusLabel(entry.item)]++; });
        return CAT_STATE_RULES.filter(function (rule) {
          return rule.matches(counts, items.length);
        })[0].state;
      }

      function catAsset(stateName) {
        var assets = window.SUPPLIER_NYAN_CAT_ASSETS || {};
        return assets[stateName] || assets.recommended || '';
      }

      function installAppIcon() {
        var assets = window.SUPPLIER_NYAN_CAT_ASSETS || {};
        if (!assets.appIcon) return;
        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/png';
        icon.href = assets.appIcon;
        document.head.appendChild(icon);
        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = assets.appIcon;
        document.head.appendChild(appleIcon);
      }

      function flattenItems(sourceCases) {
        var items = [];
        (sourceCases || state.cases).forEach(function (caseData) {
          (caseData.allItems || caseData.primaryItems || []).forEach(function (item) {
            items.push({
              caseId: caseData.caseId,
              caseName: caseData.caseName,
              agency: caseData.agency,
              deadline: caseData.deadline,
              caseStatus: caseData.status,
              item: item
            });
          });
        });
        return items.sort(function (a, b) {
          return (statusLabel(a.item) === '完了' ? 1 : 0) -
            (statusLabel(b.item) === '完了' ? 1 : 0);
        });
      }

      function questDefinition(type) {
        return QUESTS.filter(function (quest) { return quest.type === type; })[0];
      }

      function casesForQuest(type) {
        if (!type) return state.cases;
        return state.cases.filter(function (caseData) {
          return (caseData.questTypes || []).indexOf(type) >= 0;
        });
      }

      function renderQuests() {
        document.getElementById('questList').innerHTML = QUESTS.map(function (quest) {
          return '<button class="quest-button" type="button" data-quest="' +
            quest.type + '"><span>' + escapeHtml(quest.label) +
            '</span><strong class="quest-count">' +
            Number(state.questCounts[quest.type] || 0) + '件</strong></button>';
        }).join('');
      }

      function renderHero(items) {
        var catState = catStateForItems(items);
        var recommended = items.filter(function (entry) {
          return statusLabel(entry.item) !== '完了';
        })[0] || items[0];
        var hero = document.getElementById('homeHero');
        hero.className = 'card hero cat-state-' + catState;
        var catMarkup =
          '<div class="cat-placeholder" data-cat-image-slot="home">' +
            (catAsset(catState)
              ? '<img src="' + catAsset(catState) + '" alt="' +
                escapeHtml(state.catName || '相棒猫') + '">'
              : '<div>🐈<small>猫イラスト<br>差し替え枠</small></div>') +
            (recommended
              ? '<div class="board-copy" aria-hidden="true">' +
                  '<span class="recommend-label">今日のおすすめ</span>' +
                  '<div class="recommend-name">' +
                    escapeHtml(recommended.item.name || '品目名未設定') +
                  '</div>' +
                  '<div class="recommend-meta">' +
                    escapeHtml(quantityText(recommended.item)) +
                    '<span class="recommend-status">' +
                      escapeHtml(statusLabel(recommended.item)) +
                    '</span>' +
                  '</div>' +
                '</div>'
              : '') +
          '</div>';
        hero.innerHTML = recommended
          ? '<button class="recommend-stage" type="button" data-case-id="' +
              escapeHtml(recommended.caseId) + '" data-item-id="' +
              escapeHtml(recommended.item.itemId) + '" aria-label="' +
              escapeHtml((recommended.item.name || 'おすすめ品目') +
                'の詳細を開く') + '">' + catMarkup + '</button>'
          : catMarkup;
      }

      function renderProgressSummary(items) {
        var counts = { '未着手': 0, '調査中': 0, '回答待ち': 0, '完了': 0 };
        items.forEach(function (entry) { counts[statusLabel(entry.item)]++; });
        document.getElementById('progressSummary').innerHTML =
          ['未着手', '調査中', '回答待ち', '完了'].map(function (label) {
            return '<div class="progress-stat ' +
              (label === '完了' ? 'complete' : '') + '"><span>' +
              escapeHtml(label) + '</span><strong>' + counts[label] +
              '<small>件</small></strong></div>';
          }).join('');
      }

      function renderCaseList() {
        var container = document.getElementById('caseList');
        var visibleCases = casesForQuest(state.activeQuest);
        var items = flattenItems(visibleCases);
        renderQuests();
        renderHero(items);
        renderProgressSummary(items);
        var filter = document.getElementById('questFilter');
        var definition = questDefinition(state.activeQuest);
        filter.hidden = !definition;
        filter.innerHTML = definition
          ? '<strong>' + escapeHtml(definition.label) + '</strong>' +
            '<button type="button" data-clear-quest>すべて表示</button>' : '';
        document.getElementById('caseListHeading').textContent = definition
          ? '対象の品目' : '探す品目';
        if (!items.length) {
          container.innerHTML =
            '<div class="card empty">' + (definition
              ? '現在、このクエストの対象案件はありません。'
              : '現在、探す品目はありません。') + '</div>';
          return;
        }
        container.innerHTML = items.map(function (entry) {
          var item = entry.item;
          var progress = statusLabel(item);
          return '<button class="feed-card ' + statusClass(progress) +
            '" type="button" data-case-id="' + escapeHtml(entry.caseId) +
            '" data-item-id="' + escapeHtml(item.itemId) + '">' +
            '<div class="feed-main"><h3 class="feed-name">' +
            escapeHtml(item.name || '品目名未設定') + '</h3>' +
            (item.specification ? '<p class="feed-spec">' +
              escapeHtml(item.specification) + '</p>' : '') +
            '<div class="chips">' + equivalentChip(item.equivalentAllowed) +
            '</div><div class="feed-case">' +
            escapeHtml(entry.caseId) +
            (entry.agency ? '｜' + escapeHtml(entry.agency) : '') +
            '</div></div><div class="feed-side"><strong class="quantity">' +
            escapeHtml(quantityText(item)) + '</strong>' +
            '<span class="chip status-chip ' + statusClass(progress) + '">' +
            escapeHtml(progress) + '</span></div><span>›</span></button>';
        }).join('');
      }

      function field(label, value) {
        if (value === '' || value === null || value === undefined) return '';
        return '<div class="field"><dt>' + escapeHtml(label) + '</dt><dd>' +
          escapeHtml(value) + '</dd></div>';
      }

      function renderQuoteSection(item, index) {
        var quotes = item.quotes || [];
        return '<section class="quote-section"><div class="quote-heading">' +
          '<h4>見積書</h4><button class="quote-add" type="button" ' +
          'data-add-quote="' + index + '">＋ 見積書を追加</button>' +
          '<input class="quote-input" type="file" data-quote-file="' + index +
          '" accept="application/pdf,image/jpeg,image/png"></div>' +
          (quotes.length
            ? '<div class="quote-list">' + quotes.map(function (quote) {
                var content = '📄 <span>' +
                  escapeHtml(quote.fileName || '見積書') + '</span>';
                return quote.driveUrl
                  ? '<a class="quote-file" href="' +
                    escapeHtml(quote.driveUrl) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    content + '</a>'
                  : '<div class="quote-file">' + content + '</div>';
              }).join('') + '</div>'
            : '<p class="quote-empty">（未登録）</p>') +
          '</section>';
      }

      function renderItemCard(item, index, expanded) {
        return '<article class="card item-card ' + (expanded ? 'expanded' : '') +
          '" data-item-card="' + index + '">' +
          '<button class="item-summary" type="button" data-toggle-item="' + index +
          '" aria-expanded="' + expanded + '"><div><span class="case-id">' +
          escapeHtml(item.itemId) + '</span><div class="item-title-row">' +
          '<h3 class="item-title">' + escapeHtml(item.name || '品目名未設定') +
          '</h3><strong class="quantity">' + escapeHtml(quantityText(item)) +
          '</strong></div><div class="chips">' +
          equivalentChip(item.equivalentAllowed) +
          (item.contacted
            ? '<span class="chip allow">問い合わせ済み</span>' : '') +
          '</div></div><span class="chevron">⌄</span></button>' +
          '<div class="item-body"' + (expanded ? '' : ' hidden') + '>' +
          '<div class="detail-priority">' +
          (item.specification
            ? '<div class="spec-block">' + escapeHtml(item.specification) + '</div>'
            : '') +
          '<div class="chips">' + equivalentChip(item.equivalentAllowed) + '</div>' +
          (item.equivalentComment
            ? '<p class="equivalent-comment">' +
              escapeHtml(item.equivalentComment) + '</p>'
            : '') +
          '</div><dl class="fields secondary-fields">' +
          field('メーカー', item.manufacturer) +
          field('ブランド', item.brand) +
          field('型番', item.modelNumber) +
          '</dl><div class="progress-box">' +
          '<label class="field-label" for="researchStatus' + index +
          '">調査状態</label><select id="researchStatus' + index +
          '" class="status-select" data-research-status="' + index + '">' +
          ['未着手', '調査中', '回答待ち', '完了'].map(function (status) {
            return '<option value="' + status + '"' +
              (statusLabel(item) === status ? ' selected' : '') + '>' +
              status + '</option>';
          }).join('') + '</select>' +
          '<label class="check-control"><input type="checkbox" data-contacted="' +
          index + '"' + (item.contacted ? ' checked' : '') +
          '>問い合わせ済み</label>' +
          '<button class="memo-toggle" type="button" data-memo-toggle="' + index +
          '">' + (item.inquiryMemo ? '問い合わせメモを編集' : 'メモを追加') +
          '</button><div class="memo-panel"' +
          (item.inquiryMemo ? '' : ' hidden') + '>' +
          '<textarea maxlength="1000" data-memo="' + index +
          '" placeholder="返信待ち、見積依頼済み、納期確認中など">' +
          escapeHtml(item.inquiryMemo || '') + '</textarea>' +
          '<div class="compact-actions"><button class="secondary-button" ' +
          'type="button" data-save-memo="' + index + '">メモを保存</button></div>' +
          '<div class="save-state" data-save-state="' + index + '"></div></div>' +
          '</div><div class="compact-actions">' +
          '<button class="secondary-button" type="button" data-copy-item="' +
          index + '">全部コピー</button>' +
          '<button class="secondary-button" type="button" data-copy-name="' +
          index + '">品目名のみ</button></div>' +
          renderQuoteSection(item, index) + '</div></article>';
      }

      function renderDetail(data) {
        state.currentCase = data.case;
        var items = data.case.items || [];
        var selectedIndex = items.findIndex(function (item) {
          return item.itemId === state.selectedItemId;
        });
        if (selectedIndex < 0) selectedIndex = 0;
        var selected = items[selectedIndex];
        var cards = selected ? renderItemCard(selected, selectedIndex, true) : '';
        document.getElementById('caseDetail').innerHTML =
          '<section class="card detail-header">' +
          '<div class="summary-row"><span>有効品目 ' + items.length + '件</span>' +
          '<span>同等品未確認 ' + (data.case.unknownEquivalentCount || 0) +
          '件</span><span id="contactedSummary">問い合わせ済み ' +
          (data.case.contactedCount || 0) + '件</span></div>' +
          (items.length > 1
            ? '<div class="top-copy"><button id="copyAllButton" ' +
              'class="secondary-button" type="button">全品目をコピー</button></div>'
            : '') + '</section><div class="stack">' +
          (cards || '<div class="card empty">この案件には有効な品目がありません。</div>') +
          '</div><details class="case-context"><summary>案件情報を見る</summary>' +
          '<dl class="fields">' + field('案件ID', data.case.caseId) +
          field('案件名', data.case.caseName) + field('発注機関', data.case.agency) +
          field('締切', data.case.deadline) + field('納期', data.case.deliveryDate) +
          field('状態', data.case.status) + field('備考', data.case.notes) +
          '</dl></details>';
        document.getElementById('listScreen').hidden = true;
        document.getElementById('detailScreen').hidden = false;
        window.scrollTo(0, 0);
      }

      function updateContactedSummary() {
        if (!state.currentCase) return;
        var count = state.currentCase.items.filter(function (item) {
          return item.contacted;
        }).length;
        state.currentCase.contactedCount = count;
        var target = document.getElementById('contactedSummary');
        if (target) target.textContent = '問い合わせ済み ' + count + '件';
      }

      function saveProgress(
        index,
        nextContacted,
        nextMemo,
        nextResearchStatus,
        sourceControl
      ) {
        if (!state.currentCase || state.progressSaving[index]) return;
        var item = state.currentCase.items[index];
        var oldContacted = item.contacted;
        var oldMemo = item.inquiryMemo || '';
        var oldResearchStatus = statusLabel(item);
        state.progressSaving[index] = true;
        if (sourceControl) sourceControl.disabled = true;
        var status = document.querySelector('[data-save-state="' + index + '"]');
        if (status) status.textContent = '保存中…';
        return api(
          'api_saveItemProgress',
          state.currentCase.caseId,
          item.itemId,
          nextContacted,
          nextMemo,
          nextResearchStatus
        ).then(function (saved) {
          item.contacted = saved.contacted;
          item.inquiryMemo = saved.memo;
          item.researchStatus = saved.researchStatus;
          updateContactedSummary();
          if (status) status.textContent = '保存済み';
          showToast('保存しました');
        }).catch(function (error) {
          item.contacted = oldContacted;
          item.inquiryMemo = oldMemo;
          item.researchStatus = oldResearchStatus;
          var checkbox = document.querySelector('[data-contacted="' + index + '"]');
          if (checkbox) checkbox.checked = oldContacted;
          var memo = document.querySelector('[data-memo="' + index + '"]');
          if (memo) memo.value = oldMemo;
          var researchStatus = document.querySelector(
            '[data-research-status="' + index + '"]'
          );
          if (researchStatus) researchStatus.value = oldResearchStatus;
          if (status) status.textContent = '保存できませんでした';
          showToast(error.message || '保存できませんでした');
        }).finally(function () {
          state.progressSaving[index] = false;
          if (sourceControl) sourceControl.disabled = false;
        });
      }

      function uploadQuote(index, input) {
        if (!state.currentCase || state.quoteUploading[index]) return;
        var file = input.files && input.files[0];
        if (!file) return;
        var allowed = ['application/pdf', 'image/jpeg', 'image/png'];
        if (allowed.indexOf(file.type) < 0) {
          input.value = '';
          return showToast('PDF、JPG、PNGを選択してください');
        }
        if (file.size > 8 * 1024 * 1024) {
          input.value = '';
          return showToast('8MB以内のファイルを選択してください');
        }

        var supplierName = window.prompt(
          '会社名（任意）',
          ''
        );
        if (supplierName === null) {
          input.value = '';
          return;
        }

        var item = state.currentCase.items[index];
        var addButton = document.querySelector(
          '[data-add-quote="' + index + '"]'
        );
        state.quoteUploading[index] = true;
        if (addButton) {
          addButton.disabled = true;
          addButton.textContent = '保存中…';
        }
        showToast('見積書を保存しています');

        var reader = new FileReader();
        reader.onload = function () {
          var base64Data = String(reader.result || '').split(',')[1] || '';
          api(
            'api_uploadQuoteFile',
            state.currentCase.caseId,
            item.itemId,
            String(supplierName || '').trim(),
            file.name,
            file.type,
            base64Data
          ).then(function (quote) {
            item.quotes = item.quotes || [];
            item.quotes.push(quote);
            state.quoteUploading[index] = false;
            input.value = '';
            renderDetail({ case: state.currentCase });
            showToast(quoteSuccessMessage(supplierName), {
              type: 'success',
              duration: 2600
            });
          }).catch(function (error) {
            showToast(error.message || '見積書を保存できませんでした');
          }).finally(function () {
            state.quoteUploading[index] = false;
            input.value = '';
            if (addButton) {
              addButton.disabled = false;
              addButton.textContent = '＋ 見積書を追加';
            }
          });
        };
        reader.onerror = function () {
          state.quoteUploading[index] = false;
          input.value = '';
          if (addButton) {
            addButton.disabled = false;
            addButton.textContent = '＋ 見積書を追加';
          }
          showToast('ファイルを読み取れませんでした');
        };
        reader.readAsDataURL(file);
      }

      function showError(containerId, error, retry) {
        document.getElementById(containerId).innerHTML =
          '<div class="card error"><p>' + escapeHtml(
            error && error.message
              ? error.message
              : '案件情報を読み込めませんでした。時間を置いてもう一度お試しください。'
          ) + '</p>' + (retry
            ? '<button class="retry-button" type="button" data-retry>再読み込み</button>'
            : '') + '</div>';
      }

      function loadCases() {
        return api('api_listResearchCases').then(function (data) {
          state.cases = data.cases || [];
          state.questCounts = data.questCounts || {};
          renderCaseList();
        }).catch(function () {
          showError('caseList', {
            message: '案件情報を読み込めませんでした。時間を置いてもう一度お試しください。'
          }, true);
        });
      }

      function navigationState(view, extras) {
        var source = extras || {};
        return {
          view: view || 'list',
          quest: source.quest || '',
          caseId: source.caseId || '',
          itemId: source.itemId || '',
          scrollY: Number(source.scrollY || 0)
        };
      }

      function persistNavigation(value) {
        try { sessionStorage.setItem(NAVIGATION_KEY, JSON.stringify(value)); }
        catch (ignore) {}
      }

      function replaceCurrentListScroll() {
        if (document.getElementById('listScreen').hidden) return;
        state.homeScrollY = window.scrollY || 0;
        var current = navigationState('list', {
          quest: state.activeQuest,
          scrollY: state.homeScrollY
        });
        history.replaceState(current, '', location.href);
        persistNavigation(current);
      }

      function showListScreen(route) {
        var target = route || navigationState('list');
        syncCurrentCaseIntoList();
        state.currentCase = null;
        state.selectedItemId = '';
        state.activeQuest = target.quest || '';
        state.homeScrollY = Number(target.scrollY || 0);
        document.getElementById('detailScreen').hidden = true;
        document.getElementById('listScreen').hidden = false;
        renderCaseList();
        persistNavigation(target);
        setTimeout(function () { window.scrollTo(0, state.homeScrollY); }, 0);
      }

      function openCase(caseId, itemId, options) {
        var settings = options || {};
        if (!settings.fromHistory) {
          replaceCurrentListScroll();
          var route = navigationState('detail', {
            quest: state.activeQuest,
            caseId: caseId,
            itemId: itemId
          });
          history.pushState(route, '', location.href);
          persistNavigation(route);
        }
        state.selectedItemId = itemId || '';
        document.getElementById('caseDetail').innerHTML =
          '<div class="loading">品目を読み込んでいます…</div>';
        document.getElementById('listScreen').hidden = true;
        document.getElementById('detailScreen').hidden = false;
        api('api_getResearchCaseDetail', caseId)
          .then(renderDetail)
          .catch(function (error) { showError('caseDetail', error, true); });
      }

      function openQuest(type) {
        var matches = casesForQuest(type);
        if (!matches.length) {
          showToast('今は確認が必要な案件はありません。');
          return;
        }
        if (type === 'document_review' && matches.length === 1) {
          var firstItem = (matches[0].allItems || matches[0].primaryItems || [])[0];
          openCase(matches[0].caseId, firstItem ? firstItem.itemId : '');
          return;
        }
        replaceCurrentListScroll();
        var route = navigationState('list', { quest: type, scrollY: 0 });
        state.activeQuest = type;
        history.pushState(route, '', location.href);
        persistNavigation(route);
        renderCaseList();
        window.scrollTo(0, 0);
      }

      function applyNavigation(route) {
        var target = route || navigationState('list');
        if (target.view === 'detail' && target.caseId) {
          state.activeQuest = target.quest || '';
          openCase(target.caseId, target.itemId, { fromHistory: true });
          return;
        }
        showListScreen(target);
      }

      function openHomeCardFromEvent(e) {
        var card = e.target.closest('[data-case-id]');
        if (card) openCase(
          card.getAttribute('data-case-id'),
          card.getAttribute('data-item-id')
        );
      }
      function syncCurrentCaseIntoList() {
        if (!state.currentCase) return;
        state.cases.forEach(function (caseData) {
          if (caseData.caseId !== state.currentCase.caseId) return;
          var currentItems = state.currentCase.items || [];
          (caseData.items || []).forEach(function (listItem) {
            var currentItem = currentItems.find(function (item) {
              return item.itemId === listItem.itemId;
            });
            if (!currentItem) return;
            listItem.contacted = currentItem.contacted;
            listItem.inquiryMemo = currentItem.inquiryMemo;
            listItem.researchStatus = currentItem.researchStatus;
          });
        });
      }
      document.getElementById('caseList').addEventListener(
        'click',
        openHomeCardFromEvent
      );
      document.getElementById('homeHero').addEventListener(
        'click',
        openHomeCardFromEvent
      );
      document.getElementById('questList').addEventListener('click', function (e) {
        var button = e.target.closest('[data-quest]');
        if (button) openQuest(button.getAttribute('data-quest'));
      });
      document.getElementById('questFilter').addEventListener('click', function (e) {
        if (!e.target.closest('[data-clear-quest]')) return;
        replaceCurrentListScroll();
        var route = navigationState('list', { scrollY: 0 });
        history.pushState(route, '', location.href);
        state.activeQuest = '';
        persistNavigation(route);
        renderCaseList();
        window.scrollTo(0, 0);
      });
      document.getElementById('backButton').addEventListener('click', function () {
        if (history.state && history.state.view === 'detail') history.back();
        else showListScreen(navigationState('list', { quest: state.activeQuest }));
      });
      window.addEventListener('popstate', function (event) {
        applyNavigation(event.state || navigationState('list'));
      });
      window.addEventListener('pagehide', replaceCurrentListScroll);
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-retry]')) {
          if (!document.getElementById('detailScreen').hidden && history.state.caseId) {
            openCase(history.state.caseId, history.state.itemId, { fromHistory: true });
          } else loadCases();
        }
      });
      document.getElementById('caseDetail').addEventListener('click', function (e) {
        var index, control;
        control = e.target.closest('[data-toggle-item]');
        if (control) {
          index = Number(control.getAttribute('data-toggle-item'));
          var card = document.querySelector('[data-item-card="' + index + '"]');
          var body = card.querySelector('.item-body');
          body.hidden = !body.hidden;
          card.classList.toggle('expanded', !body.hidden);
          control.setAttribute('aria-expanded', String(!body.hidden));
        }
        control = e.target.closest('[data-copy-item]');
        if (control) {
          index = Number(control.getAttribute('data-copy-item'));
          copyText(itemCopyText(state.currentCase.items[index]));
        }
        control = e.target.closest('[data-copy-name]');
        if (control) {
          index = Number(control.getAttribute('data-copy-name'));
          copyText(state.currentCase.items[index].name || '');
        }
        control = e.target.closest('[data-add-quote]');
        if (control) {
          index = Number(control.getAttribute('data-add-quote'));
          var fileInput = document.querySelector(
            '[data-quote-file="' + index + '"]'
          );
          if (fileInput) fileInput.click();
        }
        control = e.target.closest('[data-memo-toggle]');
        if (control) {
          index = Number(control.getAttribute('data-memo-toggle'));
          var panel = document.querySelector('[data-memo="' + index + '"]')
            .closest('.memo-panel');
          panel.hidden = !panel.hidden;
        }
        control = e.target.closest('[data-save-memo]');
        if (control) {
          index = Number(control.getAttribute('data-save-memo'));
          var item = state.currentCase.items[index];
          var memoValue = document.querySelector('[data-memo="' + index + '"]')
            .value.trim();
          saveProgress(
            index,
            item.contacted,
            memoValue,
            statusLabel(item),
            control
          );
        }
        if (e.target.id === 'copyAllButton') {
          copyText(state.currentCase.items.map(function (item, itemIndex) {
            return '【品目' + (itemIndex + 1) + '】\n' + itemCopyText(item);
          }).join('\n\n'));
        }
      });
      document.getElementById('caseDetail').addEventListener('change', function (e) {
        var index;
        if (e.target.hasAttribute('data-quote-file')) {
          index = Number(e.target.getAttribute('data-quote-file'));
          uploadQuote(index, e.target);
          return;
        }
        if (e.target.hasAttribute('data-research-status')) {
          index = Number(e.target.getAttribute('data-research-status'));
          var statusItem = state.currentCase.items[index];
          saveProgress(
            index,
            statusItem.contacted,
            statusItem.inquiryMemo || '',
            e.target.value,
            e.target
          );
          return;
        }
        if (!e.target.hasAttribute('data-contacted')) return;
        index = Number(e.target.getAttribute('data-contacted'));
        var item = state.currentCase.items[index];
        saveProgress(
          index,
          e.target.checked,
          item.inquiryMemo || '',
          statusLabel(item),
          e.target
        );
      });

      document.getElementById('settingsButton').addEventListener('click', function () {
        document.getElementById('settingsModal').hidden = false;
      });
      document.getElementById('closeSettingsButton').addEventListener('click',
        function () { document.getElementById('settingsModal').hidden = true; });
      document.getElementById('changeNameButton').addEventListener('click',
        function () {
          document.getElementById('settingsModal').hidden = true;
          openNameModal(false);
        });
      document.getElementById('cancelNameButton').addEventListener('click',
        closeNameModal);
      document.getElementById('nameForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (state.savingName) return;
        var name = document.getElementById('catName').value.trim();
        if (!name) return showToast('猫の名前を入力してください');
        var button = document.getElementById('saveNameButton');
        state.savingName = true;
        button.disabled = true;
        button.textContent = '保存中…';
        api('api_saveCatName', name).then(function (saved) {
          state.catName = saved.catName;
          updateCompanion();
          document.getElementById('nameModal').hidden = true;
          showToast('猫の名前を保存しました');
          try {
            localStorage.removeItem('supplier-nyan:cat-name:' + state.environment);
          } catch (ignore) {}
        }).catch(function (error) {
          showToast(error.message || '名前を保存できませんでした');
        }).finally(function () {
          state.savingName = false;
          button.disabled = false;
          button.textContent = 'この名前にする';
        });
      });

      try {
        state.restoredNavigation = JSON.parse(
          sessionStorage.getItem(NAVIGATION_KEY) || 'null'
        );
      } catch (ignore) {
        state.restoredNavigation = null;
      }
      var initialNavigation = history.state || state.restoredNavigation ||
        navigationState('list');
      history.replaceState(initialNavigation, '', location.href);

      api('api_getAppContext').then(function (context) {
        state.environment = context.environment;
        state.version = context.version;
        state.deploymentVersion = context.deploymentVersion || '-';
        document.getElementById('environmentBadge').hidden =
          context.environment !== 'test';
        document.getElementById('environmentInfo').innerHTML =
          '<strong>環境情報</strong><br>環境：' +
          escapeHtml(context.environment === 'test' ? 'TEST' : context.environment) +
          '<br>バージョン：' + escapeHtml(context.version) +
          '<br>デプロイバージョン：' +
          escapeHtml(context.deploymentVersion || '-');
        state.catName = context.catName || '';
        if (!state.catName) {
          var legacy = '';
          try {
            legacy = localStorage.getItem(
              'supplier-nyan:cat-name:' + context.environment
            ) || '';
          } catch (ignore) {}
          if (legacy.trim()) {
            return api('api_saveCatName', legacy.trim()).then(function (saved) {
              state.catName = saved.catName;
            }).catch(function () {
              openNameModal(true);
            });
          }
          openNameModal(true);
        }
      }).then(function () {
        updateCompanion();
        return loadCases();
      }).then(function () {
        applyNavigation(initialNavigation);
      }).catch(function (error) {
        showError('caseList', error, true);
      });

      window.SupplierNyanUi = Object.freeze({
        equivalentLabel: equivalentLabel,
        itemCopyText: itemCopyText,
        shortDeadline: shortDeadline
      });
      installAppIcon();
    })();
  </script>
</body>
</html>
